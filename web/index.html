    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TOKEN</title>

      name="description"

    />

    <meta
      name="theme-color"

      name="theme-color"

      media="(prefers-color-scheme: dark)"
    />

    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

      content="One API key to the best AI models, served at full quality, with automatic failover, honest uptime numbers and clear billing."
